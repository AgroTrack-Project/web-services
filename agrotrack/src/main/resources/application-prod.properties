# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Integration
agrotrack.integration.farming.mode=local

# Swagger server
# El server de Swagger/OpenAPI se fija explicitamente en OpenApiConfiguration (esta property no existe en springdoc y no tiene efecto)
# springdoc.swagger-ui.server-url=https://agotrack.onrender.com

# JWT
authorization.jwt.secret=${JWT_SECRET}

# OpenWeather
openweather.api.key=${OPENWEATHER_API_KEY}