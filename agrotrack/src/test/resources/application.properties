spring.application.name=agrotrack-test

server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:h2:mem:agrotrack_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.example.agrotrack.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizeTablePhysicalNamingStrategy

agrotrack.integration.farming.mode=mockapi
agrotrack.integration.farming.mockapi-url=https://6a02c43e0d92f63dd25406d7.mockapi.io/api/v1
agrotrack.integration.identity.mode=stub

authorization.jwt.secret=AgroTrackTestOnlySecretKeyDoNotUseInProd2026AndesSmartPlatform
authorization.jwt.expiration.days=7

openweather.api.url=https://api.openweathermap.org/data/2.5
openweather.api.key=test-key
