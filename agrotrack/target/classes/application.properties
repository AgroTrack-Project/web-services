spring.application.name=agrotrack
spring.profiles.active=dev

# Server
server.servlet.context-path=/api/v1

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/agrotrack?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.example.agrotrack.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizeTablePhysicalNamingStrategy

# OpenAPI
documentation.application.description=AgroTrack - Plataforma de monitoreo agricola
documentation.application.version=1.0.0
